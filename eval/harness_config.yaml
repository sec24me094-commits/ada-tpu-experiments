# EleutherAI lm-evaluation-harness configuration for ADA models.
# Usage:
#   lm_eval --config eval/harness_config.yaml

model: hf
model_args:
  pretrained: checkpoints/ada-nano
  config: configs/ada_nano.yaml
  trust_remote_code: true

tasks:
  - lambada_openai
  - hellaswag
  - arc_easy
  - arc_challenge
  - winogrande

num_fewshot: 0   # Standard zero-shot evaluation protocol
batch_size: auto
output_path: eval/results/
log_samples: true
