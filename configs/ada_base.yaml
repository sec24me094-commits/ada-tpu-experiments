# ADA-Base — reference config, ~1B parameters (Phase 3 scaling study).
name: ada-base

vocab_size: 32000
hidden_dim: 2048
num_layers: 24
max_seq_len: 2048

use_ssm: true
ssm_state_dim: 128
ssm_num_heads: 16
ssm_head_dim: 128
ssm_conv_kernel: 4

use_moe: true
moe_num_experts: 8
moe_top_k: 2
moe_expert_hidden_mult: 2.0
lambda_balance: 0.01

use_dynamic_sparse_attn: true
num_query_heads: 16
num_kv_heads: 4
attn_sparsity_target: 0.5

use_adaptive_depth: true
depth_controller_hidden: 256
depth_budget_tau: 0.75
lambda_depth: 0.01

dropout: 0.0
initializer_range: 0.02

learning_rate: 2.0e-4
min_learning_rate: 2.0e-5
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
warmup_steps: 2000
batch_size_tokens: 1048576
micro_batch_size: 4
training_tokens: 30000000000
grad_clip: 1.0
seed: 0
